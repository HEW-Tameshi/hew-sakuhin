<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>レビュー - ココロのメール便</title>
    <link rel="stylesheet" href="css/review1.css">
</head>
<body>
    <header>
        <div class="logo">ココロのメール便</div>
    </header>
    <main id="reviewpage">
        <div id="reviewbox">
            <button id="closebutton">×</button>
            <h1>レビュー</h1>
            <p id="reviewmessage">今回の相談はいかがでしたか？</p>

            <section class="reviewarea">
                <h2>― AIまとめ ―</h2>
                <div id="summarybox">
                    <p id="summarytext"></p>
                </div>
            </section>

            <section class="reviewarea">
                <h2>― 評価 ―</h2>
                <div id="stars">
                    <span class="star">☆</span>
                    <span class="star">☆</span>
                    <span class="star">☆</span>
                    <span class="star">☆</span>
                    <span class="star">☆</span>
                </div>
                <p id="ratingtext">星を選択してください</p>
            </section>

            <section class="reviewarea">
                <h2>― コメント ―</h2>
                <textarea id="comment">親身になって寄りそって話を聞いてくれた。</textarea>
            </section>

            <section class="reviewarea">
                <h2>― チップ ―</h2>
                <p id="tipmessage">感謝の気持ちをポイントで送れます</p>
                <div id="tipbuttons">
                    <button class="tipbutton" data-point="0">なし</button>
                    <button class="tipbutton" data-point="50">50pt</button>
                    <button class="tipbutton active" data-point="100">100pt</button>
                    <button class="tipbutton" data-point="200">200pt</button>
                    <button class="tipbutton" data-point="300">300pt</button>
                </div>

                <div id="pointbox">
                    <span id="point">100</span>
                    <span>pt</span>
                </div>
                <p id="pointbuy">ポイント追加購入はこちら ▶</p>
            </section>
            <button id="sendbutton">送信</button>
        </div>
    </main>
    
    <!-- 送信確認モーダル -->
    <div id="sendconfirmmodal">
        <div id="sendconfirmwindow">
            <button id="sendconfirmclose" type="button">×</button>

            <div class="send-confirm-icon">✉️</div>

            <p class="send-step-label">REVIEW CONFIRMATION</p>
            <h2>この内容で送信しますか？</h2>

            <div class="send-confirm-summary">
                        <p class="send-summary-label">送信するチップ</p>

                <p class="send-tip-point">
                    <strong><span id="confirmTipPoint">100</span>pt</strong>
                </p>

                <div class="send-point-change">
                    <div>
                        <span>現在のポイント</span>
                        <strong id="sendBeforePoint">230pt</strong>
                    </div>

                    <span class="send-point-arrow">▶</span>

                    <div>
                        <span>送信後</span>
                        <strong id="sendAfterPoint">130pt</strong>
                    </div>
                </div>
            </div>

            <p id="sendConfirmMessage">
                レビューとチップを相手に送信します。
            </p>

            <div class="send-confirm-buttons">
                <button id="sendCancelButton" type="button">
                    キャンセル
                </button>

                <button id="sendConfirmButton" type="button">
                    送信を確定する
                </button>
            </div>
        </div>
</div>
    <div id="pointgoat">
        <img src="images/pointsgoat.png" alt="ヤギ">
        <span id="userpoint">230pt</span>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/review1.js"></script>

</body>
</html>
