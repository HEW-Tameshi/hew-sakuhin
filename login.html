<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>こころのメェ～ル便 - ログイン</title> 
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Sans-serif;
            background-color: #FDE8EB;
            display: flex;
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
            margin: 0;
        }

        .login-container {
            background: transparent;
            padding: 20px;
            width: 100%;
            max-width: 400px; 
            text-align: center;
        }

        /*こころのメェ～ル便*/
        h1 {
            font-size: 2.5rem;
            margin-bottom: 8px;
            color: #E86A7A;
            font-weight: bold;
        }

        .sub-title {
            font-size: 0.9em;
            color: #888888;
            margin-bottom: 30px;
        }

        /* ログインボタン群の共通スタイル */
        .auth-btn {
            width: 100%;
            padding: 14px 20px;
            margin-bottom: 12px;
            border-radius: 25px;
            font-size: 0.95em;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-sizing: border-box;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            text-decoration: none;
        }

        .auth-btn:active {
            transform: scale(0.98);
        }

        /* アイコンの位置固定 */
        .auth-btn svg, .auth-btn .btn-icon {
            position: absolute;
            left: 20px;
            width: 20px;
            height: 20px;
        }

        /* 1. メール/パスワードでログインボタン */
        .btn-email {
            background-color: #E86A7A;
            color: #FFFFFF;
            border: none;
            box-shadow: 0 3px 8px rgba(232, 106, 122, 0.3);
        }
        .btn-email:hover {
            background-color: #D85969;
        }

        /* 2. Googleで続けるボタン */
        .btn-google {
            background-color: #FFFFFF;
            color: #E86A7A;
            border: 1.5px solid #F3C3C9;
        }
        .btn-google:hover {
            background-color: #FFF2F4;
        }

        /* メール入力フォームエリア（初期は隠す） */
        .form-area {
            margin-top: 15px;
            text-align: center;
        }

        input[type="text"],
        input[type="email"], 
        input[type="password"] {
            width: 100%; 
            padding: 12px 16px;
            margin: 8px 0;
            border: 1.5px solid #F3C3C9;
            border-radius: 20px; 
            box-sizing: border-box; 
            background-color: #FFFFFF;
            font-size: 0.95em;
            outline: none;
        }

        input:focus {
            border-color: #E86A7A;
        }

        .forgot-password {
            display: inline-block;
            margin-top: 10px;
            color: #888888;
            font-size: 0.85em;
            text-decoration: none;
        }

        /* 最下部のアカウント切替メッセージ */
        .bottom-nav {
            margin-top: 30px;
            font-size: 0.9em;
            color: #666666;
        }

        .toggle-link {
            color: #E86A7A;
            font-weight: bold;
            cursor: pointer;
            text-decoration: underline;
            margin-left: 5px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1 id="mainTitle">こころのメェ～ル便</h1> 
        <p class="sub-title" id="subTitle">アカウントにログインして手紙を届けよう</p>

        <!-- SNS・メール選択ボタン一覧 -->
        <div id="authOptions">
            <!-- Googleで続ける -->
            <button type="button" class="auth-btn btn-google" id="googleAuthBtn">
                <svg viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <span id="googleBtnText">Googleで続ける</span>
            </button>

            <!-- メールアドレスを使う -->
            <button type="button" class="auth-btn btn-email" id="showEmailFormBtn">
                <span class="btn-icon">✉️</span>
                メールアドレスでログイン
            </button>
        </div>

        <!-- メール入力フォーム（ボタン選択後に表示） -->
        <div id="emailFormArea" class="form-area hidden">
            <form id="emailForm">
                <input type="text" id="regUsername" class="hidden" placeholder="ユーザー名（ニックネーム）">
                <input type="email" id="email" placeholder="メールアドレス" required>
                <input type="password" id="password" placeholder="パスワード" required>
                <button type="submit" class="auth-btn btn-email" style="margin-top: 15px;" id="submitBtn">ログイン</button>
            </form>
            <a href="#" class="forgot-password" id="forgotPwd">パスワードをお忘れですか?</a>
        </div>

        <!-- 最下部の切り替えナビ -->
        <div class="bottom-nav">
            <span id="navText">まだアカウントをお持ちでないですか？</span>
            <span class="toggle-link" id="toggleModeBtn">登録</span>
        </div>
    </div>

    <script>
        const authOptions = document.getElementById('authOptions');
        const emailFormArea = document.getElementById('emailFormArea');
        const showEmailFormBtn = document.getElementById('showEmailFormBtn');
        const googleAuthBtn = document.getElementById('googleAuthBtn');
        
        const regUsername = document.getElementById('regUsername');
        const submitBtn = document.getElementById('submitBtn');
        const forgotPwd = document.getElementById('forgotPwd');
        
        const navText = document.getElementById('navText');
        const toggleModeBtn = document.getElementById('toggleModeBtn');
        const googleBtnText = document.getElementById('googleBtnText');

        let isLoginMode = true; // true: ログインモード, false: 新規登録モード

        // 「メールアドレスで〜」を押したら入力欄を表示
        showEmailFormBtn.addEventListener('click', () => {
            authOptions.classList.add('hidden');
            emailFormArea.classList.remove('hidden');
        });

        // 最下部の「登録」/「ログイン」切り替え
        toggleModeBtn.addEventListener('click', () => {
            isLoginMode = !isLoginMode;

            // フォームを一旦リセットして選択画面に戻す
            authOptions.classList.remove('hidden');
            emailFormArea.classList.add('hidden');

            if (isLoginMode) {
                showEmailFormBtn.innerHTML = '<span class="btn-icon">✉️</span> メールアドレスでログイン';
                googleBtnText.textContent = 'Googleで続ける';
                submitBtn.textContent = 'ログイン';
                regUsername.classList.add('hidden');
                forgotPwd.classList.remove('hidden');
                navText.textContent = 'まだアカウントをお持ちでないですか？';
                toggleModeBtn.textContent = '登録';
            } else {
                showEmailFormBtn.innerHTML = '<span class="btn-icon">✉️</span> メールアドレスで登録';
                googleBtnText.textContent = 'Googleで登録';
                submitBtn.textContent = 'アカウント作成';
                regUsername.classList.remove('hidden');
                forgotPwd.classList.add('hidden');
                navText.textContent = 'すでにアカウントをお持ちですか？';
                toggleModeBtn.textContent = 'ログイン';
            }
        });

        // Googleログイン処理（プロトタイプ用）
        document.getElementById('emailForm').addEventListener('submit', (e) => {
            e.preventDefault(); // フォーム送信による画面再読み込みを止める

            window.location.href = './index.html';
        });

        // // フォーム送信処理
        // document.getElementById('emailForm').addEventListener('submit', (e) => {
        //     e.preventDefault();
        //     if (isLoginMode) {
        //         alert('ログインしました！');
        //     } else {
        //         alert('アカウントを登録しました！');
        //     }
        //     window.location.href = ''; // ホーム画面へのパス
        // });
    </script>
</body>
</html>
