<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>こころのメール便</title>
    <link rel="stylesheet" href="css/home.css">
</head>
<body>
    <header>
        <div class="logo">
            ココロのメール便
        </div>
    </header>

    <div class="top-menu">
        <a class="user" href="profile.html">
            <img src="images/goat.png" alt="ユーザー">
        </a>
        <div class="search">
            <span class="search-icon">⌕</span>
            <input type="text" placeholder="キーワードで検索">
        </div>
        <div class="notice">
            <img src="images/correio.png" alt="通知">
        </div>

    </div>
    <!-- 新着・速達 -->
    <div class="tabs">
        <button id="newtab" class="active">新着</button>
        <span class="tab-line"></span>
        <button id="expresstab">速達</button>
    </div>

    <!-- レター一覧 -->
    <main>
        <div id="new-letter"></div>
        <!-- レター1 -->
        <div class="letter fun">
            <div class="emotion-color"></div>
            <p class="category">趣味・雑談</p>
            <div class="letter-title">
                <h2>最近ハマっていることを話したい！</h2>
                <img class="call-icon" src="images/telefone.png" alt="通話">
            </div>
            <p class="description">
                最近すごくハマっている趣味があります！<br>
                誰かと楽しく話したいです。
            </p>
            <div class="letter-info">
                <span>60pt</span>
                <span>/</span>
                <span>15分</span>
            </div>
            <img class="goat" src="images/normal.png" alt="感情">
        </div>

        <!-- レター2 -->
        <div class="letter angry">
            <div class="emotion-color"></div>
            <p class="category">愚痴・ストレス</p>
            <div class="letter-title">
                <h2>仕事で嫌なことがあって愚痴りたい</h2>
                <img class="call-icon" src="images/telefone.png" alt="通話">
            </div>
            <p class="description">
                今日も仕事でいろいろあって…。<br>
                少しだけ愚痴を聞いてほしいです。
            </p>
            <div class="letter-info">
                <span>85pt</span>
                <span>/</span>
                <span>15分</span>
            </div>
            <img class="goat" src="images/angry.jpg" alt="感情">
        </div>

        <!-- レター3 -->
        <div class="letter sad">
            <div class="emotion-color"></div>
            <p class="category">恋愛・悩み</p>
            <div class="letter-title">
                <h2>ちょっとだけ話を聞いてほしい</h2>
                <img class="call-icon" src="images/telefone.png" alt="通話">
            </div>
            <p class="description">
                恋愛のことでモヤモヤしてて…<br>
                誰かに話を聞いてほしいです。
            </p>
            <div class="letter-info">
                <span>135pt</span>
                <span>/</span>
                <span>25分</span>
            </div>
            <img class="goat" src="images/sad.png" alt="感情">
        </div>
    </main>

    <!-- 商品詳細 -->
    <div id="detailmodal">

        <div id="detailwindow">

            <!-- 閉じる -->
            <button id="detailclose">×</button>

            <!-- 感情・カテゴリー・速達 -->
            <div id="modaltop">
                <div id="modalcategory">
                    <span id="modalemotion"></span>
                    <span id="modal-category">カテゴリー</span>
                </div>

                <span id="modalexpress">速達</span>
            </div>

            <h2 id="modal-title">見出し</h2>
            <div id="modal-info">
                <span id="modal-point">---pt</span>
                <span>/</span>
                <span id="modal-time">--分</span>
            </div>

            <div id="modal-description">
                内容がここに表示されます。
            </div>

            <div id="modal-rating">
                <span>★★★★☆</span>
                <strong>4.5</strong>
            </div>

            <button id="buybutton" onclick="location.href='chat-room.html'">購入する</button>
        </div>
    </div>

    <div id="pointgoat">
        <img src="images/pointsgoat.png" alt="ヤギ">
        <span id="userpoint">230pt</span>
    </div>

    <nav class="bottommenu">
        <a href="index.html">
            <img src="images/home.png" alt="ホーム">
            <span>ホーム</span>
        </a>
        <a href="review1.html">

            <img src="images/ai.png" alt="AI分析">
            <span>AI分析</span>
        </a>
        <a href="#">
            <img src="images/chat.png" alt="チャット">
            <span>チャット</span>
        </a>
        <a href="post.html">
            <img src="images/post.png" alt="出品">
            <span>出品</span>
        </a>
    </nav>  
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/home.js"></script>
</body>
</html>
<!-- ここで作業用 -->
