<!DOCTYPE html>

<html lang="ja">

    <head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">

    <title>profile</title>

    <link rel="stylesheet" type="text/css" href="css/reset.css">
    <link rel="stylesheet" type="text/css" href="css/profile.css">

    </head>

    <body>
        <!-- ヘッダー -->
        <header>
            <div id="logo">ココロのメール便</div>
        </header>

        <main class="profile">

            <!-- プロフィール情報 -->
            <section class="profile-info">

                <!-- アイコン -->
                <div class="profile-icon">
                <img src="images/goat.png" alt="">

                </div>
                <!-- ユーザー情報 -->
                <div class="user-info">

                    <div class="username">
                                    user name
                    </div>

                    <div class="rank">
                                    ランク：○○
                    </div>

                </div>

                <!-- ポイント -->
<!-- 一旦ボタンがないのでここをクリックすると遷移するようにした。 -->
                <a class="point" href="point.html">130pt</a>

            </section>

            <!-- メニュー -->
            <section class="menu">
                <button class="menu-button">
                    <span>出品履歴</span>
                    <span class="arrow">▶</span>
                </button>
                <button class="menu-button">
                    <span>購入履歴</span>
                    <span class="arrow">▶</span>
                </button>
                <button class="menu-button">
                    <span>AI分析</span>
                    <span class="arrow">▶</span>
                </button>
                <button class="menu-button">
                    <span>設定</span>
                    <span class="arrow">▶</span>
                </button>
            </section>

            <!-- ナビ -->
            <nav class="bottommenu">
                <a href="index.html">
                    <img src="images/home.png" alt="ホーム">
                    <span>ホーム</span>
                </a>
                <a href="#">
                    <img src="images/ai.png" alt="AI分析">
                    <span>AI分析</span>
                </a>
                <a href="#">
                    <img src="images/chat.png" alt="チャット">
                    <span>チャット</span>
                </a>
                <a href="post.html">
                    <img src="images/post.png" alt="出品">
                    <span>出品</span>
                </a>
            </nav>

        </main>

    

    </body>

</html>
