<!DOCTYPE html>

<html lang="ja">

    <head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">

    <title>profile</title>

    <link rel="stylesheet" type="text/css" href="css/reset.css">
    <link rel="stylesheet" type="text/css" href="css/profile.css">

    </head>

    <body>
        <!-- ヘッダー -->
        <header>
            <div id="logo">ココロのメール便</div>
        </header>

        <main class="profile">

            <!-- プロフィール情報 -->
            <section class="profile-info">

                <!-- アイコン -->
                <div class="profile-icon">
                <img src="profile.png" alt="プロフィール画像">

                </div>
                <!-- ユーザー情報 -->
                <div class="user-info">

                    <div class="username">
                                    user name
                    </div>

                    <div class="rank">
                                    ランク：○○
                    </div>

                </div>

                <!-- ポイント -->
                <div class="point">
                            130pt
                </div>

            </section>

            <!-- メニュー -->
            <section class="menu">
                <button class="menu-button">
                    <span>出品履歴</span>
                    <span class="arrow">▶</span>
                </button>
                <button class="menu-button">
                    <span>購入履歴</span>
                    <span class="arrow">▶</span>
                </button>
                <button class="menu-button">
                    <span>AI分析</span>
                    <span class="arrow">▶</span>
                </button>
                <button class="menu-button">
                    <span>設定</span>
                    <span class="arrow">▶</span>
                </button>
            </section>

            <!-- ナビ -->
            <nav class="bottom-menu">
                <button>ホーム</button>
                <button>AI分析</button>
                <button>チャット</button>
                <button>出品</button>
                <button>プロフィール</button>
            </nav>

        </main>

    

    </body>

</html>
