name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend-check:
    name: Frontend Check
    runs-on: ubuntu-latest

    steps:
      - name: コードを取得
        uses: actions/checkout@v5

      - name: Node.jsを準備
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: HTMLをチェック
        run: npx --yes htmlhint "**/*.html"

      - name: CSSをチェック
        run: npx --yes stylelint "css/**/*.css"

      - name: JavaScriptをチェック
        run: find js -name "*.js" -print0 | xargs -0 -r -n1 node --check

  python-check:
    name: Python Check
    runs-on: ubuntu-latest

    steps:
      - name: コードを取得
        uses: actions/checkout@v5

      - name: Pythonを準備
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: 必要なパッケージをインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pythonの構文をチェック
        run: python -m compileall -q .

      - name: Pythonの書き方をチェック
        run: ruff check .